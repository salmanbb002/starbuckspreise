name: Blog layout

on:
  push:
    branches: [main]
    paths: ['blog/**', 'blog.css', 'blog.js', 'styles.css', 'scripts/check-blog-layout.py', '.github/workflows/blog-layout.yml']
  pull_request:
    paths: ['blog/**', 'blog.css', 'blog.js', 'styles.css', 'scripts/check-blog-layout.py', '.github/workflows/blog-layout.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/check-blog-layout.py
